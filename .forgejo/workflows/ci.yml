# Generated by zLeafNinja/ci-workflows — do not hand-edit.
# Change the template there and re-run sync_ci.py; local edits are overwritten.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: bun · format:check/type-check/lint/test/build
    runs-on: forgejo-ci
    env:
      TURSO_DATABASE_URL: "libsql://test.turso.io"
      TURSO_AUTH_TOKEN: "test-token"
      NEXTAUTH_SECRET: "test-secret-32-chars-long-padding!!"
      GITHUB_CLIENT_ID: "test-client-id"
      GITHUB_CLIENT_SECRET: "test-client-secret"
      CLOUDINARY_CLOUD_NAME: "test-cloud"
      CLOUDINARY_API_KEY: "test-api-key"
      CLOUDINARY_API_SECRET: "test-api-secret"
      UNSPLASH_ACCESS_KEY: "test-unsplash-key"
      NODE_ENV: "test"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - name: format:check
        run: bun run format:check
      - name: type-check
        run: bun run type-check
      - name: lint
        run: bun run lint
      - name: test
        run: bun run test
      - name: build
        run: bun run build
