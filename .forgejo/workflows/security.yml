# Generated by zLeafNinja/ci-workflows — do not hand-edit.
#
# On merge: scan the merged tree for secrets. A key that is in the code now is a
# real defect and blocks.
# Weekly: scan the full history and the dependency tree, report only. Every repo
# has old commits holding already-rotated keys, and a permanently red run for
# those is noise, not a gate.
name: security
# Post-merge secret scan plus a weekly dependency sweep. Secrets are caught
# before they can spread; CVE advisories arrive as one scheduled report instead
# of painting every merge red.
on:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: gitleaks
    runs-on: forgejo-ci
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks
        run: |
          set -eu
          V=8.30.1
          curl -sSfL -o /tmp/gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          # Scan the merged tree, not the whole history: every repo has old
          # commits with keys that are already rotated, and a gate that is
          # permanently red for those teaches people to ignore it.
          /tmp/gitleaks detect --source . --no-git --no-banner --redact --verbose --exit-code 1

  advisories:
    name: weekly advisories
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: forgejo-ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (history, report only)
        # Old commits cannot be edited out of history; this reports them so the
        # credential can be rotated deliberately instead of failing every merge.
        run: |
          set -eu
          V=8.30.1
          curl -sSfL -o /tmp/gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact --verbose --exit-code 0

      - name: trivy (report only)
        run: |
          set -eu
          V=0.76.2
          curl -sSfL -o /tmp/trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${V}/trivy_${V}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tgz -C /tmp trivy
          /tmp/trivy fs --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 .
